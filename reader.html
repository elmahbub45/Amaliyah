<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
  <meta name="theme-color" content="#04392e">
  <link rel="stylesheet" href="reader.css">
  <title>Amaliyah Reader</title>
</head>
<body>
  <header id="top">
    <button id="readerBack" type="button" aria-label="Kembali">
      <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <b id="readerTitle">Bacaan</b>
    <button id="bookmarkTop" class="bookmark-control" type="button" aria-label="Bookmark halaman" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M7 4.5A1.5 1.5 0 0 1 8.5 3h7A1.5 1.5 0 0 1 17 4.5V21l-5-3-5 3z"/></svg>
    </button>
  </header>

  <main id="stage">
    <canvas id="pdf"></canvas>
    <button id="prev" class="arrow" type="button" aria-label="Halaman sebelumnya">
      <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
    </button>
    <button id="next" class="arrow" type="button" aria-label="Halaman berikutnya">
      <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div id="counter">1 / 1</div>
  </main>

  <footer id="tools">
    <button id="tocBtn" type="button">
      <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
      <small>Daftar Isi</small>
    </button>
    <button id="bookmarkBottom" class="bookmark-control" type="button" aria-label="Bookmark halaman" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M7 4.5A1.5 1.5 0 0 1 8.5 3h7A1.5 1.5 0 0 1 17 4.5V21l-5-3-5 3z"/></svg>
      <small>Bookmark</small>
    </button>
    <button id="zoomOut" type="button">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M8 11h6"/></svg>
      <small>Perkecil</small>
    </button>
    <button id="zoomIn" type="button">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M8 11h6M11 8v6"/></svg>
      <small>Perbesar</small>
    </button>
    <button id="moreBtn" type="button">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
      <small>Lainnya</small>
    </button>
  </footer>

  <div id="readerSheet" class="reader-sheet hidden" aria-hidden="true">
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head">
        <b id="sheetTitle">Menu</b>
        <button id="sheetClose" type="button" aria-label="Tutup">×</button>
      </div>
      <div id="sheetContent"></div>
    </div>
  </div>

  <script src="books.js"></script>
  <script type="module" src="reader.js"></script>
</body>
</html>
