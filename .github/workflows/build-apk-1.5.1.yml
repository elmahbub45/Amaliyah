name: Build Amaliyah APK 1.5.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore permanent signing key
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.AMALIYAH_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_BUNDLE_B64:-}" ]; then
            echo "ERROR: GitHub Secret AMALIYAH_SIGNING_BUNDLE_B64 belum tersedia."
            exit 1
          fi
          printf '%s' "$SIGNING_BUNDLE_B64" | base64 --decode > /tmp/amaliyah-signing.zip
          unzip -o /tmp/amaliyah-signing.zip signing.properties tools/signing/amaliyah-release.jks
          test -s signing.properties
          test -s tools/signing/amaliyah-release.jks

      - name: Configure production signing
        run: |
          cat > app/build.gradle <<'GRADLE'
          apply plugin: 'com.android.application'
          apply plugin: 'com.google.gms.google-services'

          import java.util.Properties

          def signingPropsFile = rootProject.file('signing.properties')
          def signingProps = new Properties()
          if (signingPropsFile.exists()) {
              signingPropsFile.withInputStream { signingProps.load(it) }
          }

          android {
              namespace 'id.my.elmahbub.amaliyah'
              compileSdk 35
              buildToolsVersion '35.0.0'

              defaultConfig {
                  applicationId 'id.my.elmahbub.amaliyah'
                  minSdk 23
                  targetSdk 35
                  versionCode 10501
                  versionName '1.5.1'
              }

              signingConfigs {
                  release {
                      storeFile rootProject.file(signingProps.getProperty('storeFile'))
                      storePassword signingProps.getProperty('storePassword')
                      keyAlias signingProps.getProperty('keyAlias')
                      keyPassword signingProps.getProperty('keyPassword')
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }

          dependencies {
              implementation 'com.google.firebase:firebase-messaging:24.1.0'
          }
          GRADLE

      - name: Validate V2.58.1 persistent prayer notification source
        run: |
          set -euo pipefail
          grep -F "SCHEDULER_VERSION = 2" app/src/main/java/id/my/elmahbub/amaliyah/PrayerAlarmScheduler.java
          grep -F "PRAYER_RETAINED_CHANNEL" app/src/main/java/id/my/elmahbub/amaliyah/NotificationHelper.java
          grep -F "retentionOnly" app/src/main/java/id/my/elmahbub/amaliyah/PrayerAlarmReceiver.java
          grep -F "versionCode 10501" app/build.gradle
          grep -F "versionName '1.5.1'" app/build.gradle

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Amaliyah-1.5.1-V2.58.1.apk

      - name: Verify APK identity and permanent signature
        run: |
          set -euo pipefail
          APK="Amaliyah-1.5.1-V2.58.1.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='id.my.elmahbub.amaliyah' versionCode='10501' versionName='1.5.1'" /tmp/badging.txt

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apk-signature.txt
          ACTUAL=$(grep -i 'certificate SHA-256 digest:' /tmp/apk-signature.txt | head -1 | awk '{print $NF}' | tr 'A-F' 'a-f' | tr -d ':')
          EXPECTED='c208ee86e9b746f49328bbc4d7bd960ff76368213b801851e7fa309e23e05d30'

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: signing certificate tidak cocok dengan key permanen Amaliyah."
            echo "Actual: $ACTUAL"
            exit 1
          fi

          sha256sum "$APK" > Amaliyah-1.5.1-V2.58.1.sha256.txt
          echo "OK: APK 1.5.1 dan signing key permanen terverifikasi."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amaliyah-1.5.1-V2.58.1
          path: |
            Amaliyah-1.5.1-V2.58.1.apk
            Amaliyah-1.5.1-V2.58.1.sha256.txt
          if-no-files-found: error
