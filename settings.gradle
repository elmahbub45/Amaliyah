dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        def localMaven = System.getenv('AMALIYAH_LOCAL_MAVEN')
        if (localMaven) maven { url = uri(localMaven) }
        google()
        mavenCentral()
    }
}

rootProject.name = "Amaliyah"
include(":app")
