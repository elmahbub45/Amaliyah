buildscript {
    repositories {
        def localMaven = System.getenv('AMALIYAH_LOCAL_MAVEN')
        if (localMaven) maven { url = uri(localMaven) }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath 'com.google.gms:google-services:4.4.2'
    }
}
